name: Weather Pipeline

on:
  schedule:
    - cron: "0 13 * * *"   # ~8am ET
    - cron: "0 1 * * *"    # ~8pm ET
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python scripts/download_db.py

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Data Quality Summary
        run: python scripts/validate_quality.py

      - name: Upload DB to HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python scripts/upload_db.py
